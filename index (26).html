<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--ink:#161514;--soft:#4E4943;--mute:#6E6860;--line:#E2DCD2;--blue:#0B5FA5;
--ok-b:#E3F1EC;--ok-f:#155C3A;--info-b:#E5EEF9;--info-f:#0A3D6B;--warn-b:#FCEFD9;--warn-f:#7A3E00;--bad-b:#FBE4E1;--bad-f:#8E2418;--gray-b:#EFEBE4;--gray-f:#3E3A35;
--c-ai:#2A78D6;--c-web:#EB6834;--c-salon:#1BAF7A;--bar:#8DB8EA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.4}
button{font-family:inherit;font-size:inherit;color:inherit}
header{background:var(--card);padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:22px;font-weight:800}
.sub{font-size:15px;color:var(--mute)}
select{font-size:16px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;padding:0 10px;max-width:55%}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;min-height:48px;padding:0 16px;border-radius:999px;font-size:17px;font-weight:700;border:2px solid #CFC9BF;background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
.help{background:#FFF8E8;border:1px solid #F0DDB2;border-radius:14px;padding:12px 14px}
.help b{display:block;margin-bottom:4px}
.helpbtn{background:none;border:0;color:var(--blue);font-weight:700;padding:0;min-height:40px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.warn{border:2px solid #F0B868;background:#FFFBF3}
.nhead{font-weight:800;color:var(--warn-f);font-size:16px}
.ngroup{font-size:14px;color:var(--warn-f);font-weight:700;margin-top:4px}
.nrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #F3DDB8;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:default}
.nrow .grow{font-size:16px;line-height:1.35}
.sqbtn{min-height:50px;border-radius:12px;border:0;background:#1BAF7A;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin:4px 0}
.nrow .mini{flex:0 0 auto;min-height:48px;padding:2px 10px;line-height:1.15;border-radius:12px;border:2px solid #CFC9BF;background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.h2{font-size:19px;font-weight:800}
.big{font-size:26px;font-weight:800}
.muted{color:var(--mute);font-size:15px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{min-width:62px;font-weight:800;font-size:18px}
.row .t small{display:block;font-size:13px;color:var(--mute);font-weight:600}
.grow{flex:1;min-width:0}
.who{font-weight:700;font-size:18px}
.what{color:var(--soft);font-size:15px;word-wrap:break-word}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-b);color:var(--ok-f)}.info{background:var(--info-b);color:var(--info-f)}.warn{background:var(--warn-b);color:var(--warn-f)}.bad{background:var(--bad-b);color:var(--bad-f)}.gray{background:var(--gray-b);color:var(--gray-f)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 14px;border-radius:999px;font-size:16px;font-weight:700;border:2px solid #CFC9BF;background:#fff;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.reply{background:#F3F6FA;border-radius:10px;padding:8px 10px;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.bar span.n{font-size:14px;font-weight:700}
.bar span.b{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--bar)}
.bar.last span.b{background:var(--c-ai)}
.labels{display:flex;gap:6px}.labels span{flex:1;text-align:center;font-size:13px;color:var(--soft);min-width:0;overflow:hidden}
.split{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--gray-b)}
.leg{display:flex;flex-direction:column;gap:6px;font-size:16px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-2px}
.fun{display:flex;flex-direction:column;gap:4px}
.fun .l{display:flex;justify-content:space-between;font-size:17px}
.fun .track{height:10px;border-radius:999px;background:#E5EEF9;overflow:hidden}
.fun .track span{display:block;height:100%;background:var(--c-ai)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:14px;color:var(--mute)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.close{min-height:48px;border-radius:12px;border:2px solid #CFC9BF;background:#fff;font-weight:700;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;padding:0 14px}
.bub{max-width:85%;padding:10px 12px;border-radius:14px;font-size:16px}
.bub.them{background:#fff;border:1px solid var(--line);align-self:flex-start}
.bub.ai{background:#E5EEF9;align-self:flex-end}
.bub.you{background:#E3F1EC;align-self:flex-end}
.bub small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.empty{color:var(--mute);text-align:center;padding:18px 8px}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
input.search{width:100%;min-height:48px;font-size:17px;border-radius:12px;border:2px solid var(--line);padding:0 12px}
a{color:var(--blue)}
.filters{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 auto;min-width:0;min-height:46px;padding:0 4px;border-radius:12px;font-size:15px;font-weight:700;border:2px solid #CFC9BF;background:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#D9480F;color:#fff;font-size:13px;line-height:20px}
.askbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.askbar input,.ansbox input{flex:1;min-width:0;min-height:50px;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}
.askbar button,.ansbox button{min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.you{align-self:flex-end;background:#E3F1EC;border-radius:14px;padding:10px 12px;font-size:16px;max-width:90%}
.ans{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.45;word-wrap:break-word}
.acts{display:flex;flex-direction:column;gap:8px}
.acts button{min-height:52px;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:17px;cursor:pointer}
.acts button:first-child{background:var(--blue);color:#fff}
.ansbox{display:flex;gap:8px}
.donebar{background:var(--ok-b);color:var(--ok-f);border-radius:12px;padding:10px 12px;font-weight:700}
.mimg{display:block;max-width:100%;max-height:340px;border-radius:12px;margin:2px 0 4px;cursor:pointer;background:#EFEBE4}
.mvid{display:block;width:100%;max-height:360px;border-radius:12px;margin:2px 0 4px;background:#000}
.mlink{display:block;width:100%;min-height:46px;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:16px;margin:2px 0 4px;cursor:pointer}
.mgone{font-size:15px;color:var(--mute);background:#F3F0EA;border-radius:10px;padding:8px 10px;margin:2px 0 4px}
.thbox .cam{min-width:56px;border-radius:14px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px;cursor:pointer}
.thbox.rec .cam{display:none}
.thphoto{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px}
.thphoto img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.thphoto .grow{font-size:15px}
.thphoto button{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.thans{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line);padding-top:12px;margin-top:4px}
.thans .h2{margin:0}
.draft{background:#E5EEF9;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.4}
.draft .muted{font-size:14px;margin-bottom:4px}
.two{display:flex;gap:8px}.two button{flex:1}
.go{min-height:52px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.go.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.go:disabled,.seg button:disabled{opacity:.45;cursor:default}
.thbox{display:flex;gap:8px;align-items:stretch}
.bub.newmsg{outline:3px solid #E0A33A;outline-offset:2px}
.bub.sending{opacity:.6}
#main.stale{opacity:.5;transition:opacity .15s}
.upd{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:60;background:#161514;color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;opacity:.85;pointer-events:none}
.thnote.ok{color:var(--ok-f);font-weight:700}
.thbox textarea{flex:1;min-width:0;min-height:96px;font:inherit;font-size:17px;line-height:1.35;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fff}
.thbox.rec{background:#FDECEA;border-radius:14px;padding:6px}
.thbox.rec textarea{display:none}
.thbox .mic{min-width:56px;border-radius:14px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px;cursor:pointer}
.thbox.rec .mic{background:#C62828;border-color:#C62828;color:#fff;font-size:20px}
.thbox .x{display:none;min-width:50px;border-radius:14px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:18px;cursor:pointer}
.thbox.rec .x{display:block}
.thbox.rec .recinfo{display:block}
.thnote{font-size:15px;color:var(--mute)}
.thnote.warn{color:#8E2418;font-weight:700}
.ign{min-height:46px;border-radius:12px;border:2px solid #CFC9BF;background:#fff;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
/* D4f · compact answer section */
.thans{gap:8px}
.thans .h2{font-size:18px}
.sug{display:flex;align-items:center;gap:6px;background:#E5EEF9;border-radius:12px;padding:6px 6px 6px 10px}
.sug .st{flex:1;min-width:0;font-size:15px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.sug.open .st{white-space:normal}
.sug .st b{font-weight:800}
.sug button{flex:0 0 auto;min-height:44px;padding:0 10px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:15px;cursor:pointer}
.sug button.s{background:var(--blue);color:#fff}
.sug button:disabled{opacity:.45}
.minilink{background:none;border:0;padding:6px 2px;color:var(--blue);font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.minilink.grey{color:var(--mute);font-weight:600;align-self:flex-end}
.thbox{align-items:flex-end}
.thbox .mic,.thbox .cam{min-width:46px;font-size:20px;min-height:52px}
.thbox .snd{min-height:52px}
.thbox textarea{min-height:52px;height:52px;resize:none;overflow-y:auto;max-height:200px}
.thbox .snd{min-width:68px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.thbox.rec .snd{background:#C62828}
.thnote{font-size:14px}
.thauto{font-size:14px;font-weight:700;color:#1F5E3B;padding:0 4px}
.thauto.held{color:#8A5A00}
.askbar .mic,.ansbox .mic{min-width:56px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px}
.askbar.rec,.ansbox.rec{background:#FDECEA}
.ansbox.rec{border-radius:14px;padding:6px}
.askbar.rec .mic,.ansbox.rec .mic{background:#C62828;border-color:#C62828;color:#fff;font-size:20px}
.recinfo{flex:1;min-width:0;font-size:17px;font-weight:700;color:#8E2418;display:none;align-self:center}
.askbar.rec .recinfo,.ansbox.rec .recinfo{display:block}
.askbar.rec #askq,.ansbox.rec #sheetq{display:none}
.askbar .x,.ansbox .x{display:none;background:#fff;color:var(--ink);border:2px solid var(--line)}
.askbar.rec .x,.ansbox.rec .x{display:block}

/* ---------- assistant step 1 (doc 172): the bubble and the chat ---------- */
.abub{position:fixed;z-index:18;width:62px;height:62px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center}
.abub.new::after{content:'';position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;background:#e5484d;border:2px solid #fff}
.abub.drag{cursor:grabbing;transform:scale(1.06)}
.chat{position:fixed;z-index:50;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:82vh;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);display:none;flex-direction:column}
.chat.on{display:flex}
.chhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card);border-radius:20px 20px 0 0}
.chhead .t{flex:1;min-width:0;font-weight:800;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chhead button{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.chhead button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.cm{max-width:86%;padding:10px 13px;border-radius:16px;line-height:1.4;word-wrap:break-word;overflow-wrap:anywhere}
.cm.chme{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.cm.chai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.cm .chwho{font-size:12.5px;opacity:.75;margin-bottom:2px}
.cm .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cm .acts button{min-height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.cm.chdots{color:var(--mute)}
.chmore{align-self:center;background:none;border:0;color:var(--blue);font-weight:700;min-height:40px;cursor:pointer}
.chempty{color:var(--mute);text-align:center;margin:auto 10px}
.chbox{display:flex;gap:8px;align-items:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.chbox input{flex:1;min-width:0;min-height:50px;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}
.chbox button{min-height:50px;padding:0 16px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.chbox .mic{min-width:56px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px}
.chbox .recinfo{display:none;flex:1;color:#C62828;font-weight:700}
.chbox .x{display:none;background:#fff;color:var(--ink);border:2px solid var(--line)}
.chbox.rec{background:#FDECEA}.chbox.rec .mic{background:#C62828;border-color:#C62828;color:#fff;font-size:20px}
.chbox.rec .recinfo,.chbox.rec .x{display:block}.chbox.rec #chq{display:none}

/* ---------- assistant step 2 (doc 174): Talk live ---------- */
.chhead #chcall{font-size:20px}
.chhead #chcall.live{background:#C62828;border-color:#C62828;color:#fff}
.chlive{display:none;align-items:center;gap:8px;padding:8px 14px;background:#E8F5E9;color:#1B5E20;font-weight:700;border-bottom:1px solid var(--line)}
.chlive.on{display:flex}.chlive.wait{background:#FFF8E1;color:#7A5200}
.chlive .dot{width:10px;height:10px;border-radius:50%;background:currentColor;animation:chpulse 1.4s ease-in-out infinite}
@keyframes chpulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.chlive .dot{animation:none}}
.cm.chnote{align-self:center;background:none;border:0;color:var(--mute);font-size:14px;padding:2px 8px}
.acc .row{cursor:default;align-items:center}
.acc .accbtn{border:0;border-radius:12px;background:var(--ink,#1d1b18);color:#fff;font-size:16px;font-weight:600;min-height:44px;padding:0 14px;white-space:nowrap;cursor:pointer}
.acc .accbtn.add{background:#fff;color:var(--ink,#1d1b18);border:2px solid var(--line,#e2ddd5)}
.acc .accbtn[disabled]{opacity:.6}
.acc .acchint{margin-top:8px;font-size:15px}
.acc .accsub{margin-top:14px}
.card.sys{background:#F1EEE8}
.card.sys.bad{border-color:#E7B3A9}
.sysp,.stp{margin:6px 0 8px;padding-left:20px}
.stp li{margin:2px 0}
.card.st .sts{border-top:1px solid var(--line,#e2ddd5);padding-top:8px;margin-top:8px;font-size:16px;line-height:1.45}
.card.st .stt{font-weight:700;margin-bottom:2px}
.card.st .stw{color:#9a3b22;font-weight:600}
.card.st .stm{margin-top:8px}
.card.st .stgo{margin-top:8px;font-weight:700;font-size:15px}
.hbtns{display:flex;gap:8px;align-items:center}
.stbtn{border:2px solid var(--line,#e2ddd5);background:#fff;border-radius:12px;min-height:44px;padding:0 12px;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.sbar{height:10px;border-radius:6px;background:#ece7df;overflow:hidden;margin:6px 0}
.sbar i{display:block;height:100%;background:var(--ink,#1d1b18)}
.sbar.hot i{background:#b4472b}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sref{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.sref button{border:0;background:none;font-weight:700;font-size:16px;color:var(--ink,#1d1b18);cursor:pointer;min-height:44px}
.sgo{margin-top:10px;width:100%;min-height:44px;border-radius:12px;border:2px solid var(--line,#e2ddd5);background:#fff;font-weight:700;font-size:16px;cursor:pointer}
.svc{display:inline-block;margin:3px 4px 0 0;font-size:14px;padding:3px 8px;border-radius:999px;background:#ece7df}
.svc.on{background:#dff0e3}
.sgo.pri{background:var(--ink,#1d1b18);color:#fff;border-color:var(--ink,#1d1b18)}
.slab{font-size:14px;color:var(--mute,#6b655c);margin:10px 0 4px}
.schips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.schip{display:inline-flex;align-items:center;gap:4px;background:#ece7df;border-radius:999px;padding:4px 4px 4px 12px;font-weight:700}

<body>
<header id="hdr" style="display:none">
  <div class="hrow">
    <div><div class="title" id="hname">Dashboard</div><div class="sub" id="hdate"></div></div>
    <div class="hbtns"><button type="button" id="tostudio" class="stbtn" style="display:none">🎛 Studio</button><select id="pick" style="display:none" aria-label="Choose a client"></select></div>
  </div>
  <nav id="tabs"></nav>
</header>
<div class="upd" id="upd" style="display:none">Updating…</div>
<main id="main"><div class="center"><div class="h2">Opening your dashboard…</div></div></main>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<form class="askbar" id="askbar" autocomplete="off"><button type="button" class="mic" id="mic" aria-label="Speak">🎤</button><input id="askq" enterkeyhint="send" placeholder="Ask or book…" aria-label="Ask or book"><div class="recinfo" id="recinfo">● Listening… 0 s</div><button type="button" class="x" id="recx" aria-label="Cancel">✕</button><button type="submit" id="asksend">Send</button></form>
<button type="button" class="abub" id="bub" aria-label="Open the assistant">💬</button><div class="chat" id="chat" role="dialog" aria-label="Assistant"><div class="chhead"><div class="t" id="chtitle">Assistant</div><button type="button" id="chcall" aria-label="Talk live" title="Talk live">📞</button><button type="button" id="chspeak" aria-label="Read the answers aloud" title="Read the answers aloud">🔇</button><button type="button" id="chclose" aria-label="Close">✕</button></div><div class="chlive" id="chstatus"><span class="dot"></span><span id="chstatust">Connecting…</span></div><div class="chlist" id="chlist"></div><form class="chbox" id="chbox" autocomplete="off"><button type="button" class="mic" id="chmic" aria-label="Speak">🎤</button><input id="chq" enterkeyhint="send" placeholder="Ask anything…" aria-label="Ask the assistant"><div class="recinfo" id="chrecinfo">● Listening… 0 s</div><button type="button" class="x" id="chrecx" aria-label="Cancel">✕</button><button type="submit" id="chsend">Send</button></form></div>
<script>
(function(){
var tg = window.Telegram && window.Telegram.WebApp;
var N8N = 'https://diallomamadou1.app.n8n.cloud';   // the page can live anywhere; data always comes from n8n
var API = N8N + '/webhook/dash-api';
var S = { slug: null, tab: 'today', me: null, clients: null, client: null, args: {}, showHelp: true, svcFilter: '' };
var TABS = [['today','Today'],['messages','Messages'],['bookings','Bookings'],['regulars','Regulars'],['customers','Customers'],['videos','Videos'],
            ['followups','Follow up'],['waitlist','Waitlist'],['knowledge','What the AI knows'],['rivals','Other salons'],['settings','Settings']];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pill(t, tone){ return t ? '<span class="pill ' + esc(tone || 'gray') + '">' + esc(t) + '</span>' : ''; }
function $(id){ return document.getElementById(id); }
try { if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) tg.setHeaderColor('#FFFFFF'); if (tg.setBackgroundColor) tg.setBackgroundColor('#F6F3EE'); } } catch (e) {}
try { var hs = localStorage.getItem('dash_help'); if (hs === '0') S.showHelp = false; } catch (e) {}
try { var ac = +localStorage.getItem('dash_after_connect'); if (ac && Date.now() - ac < 45 * 60000) S.tab = 'settings'; localStorage.removeItem('dash_after_connect'); } catch (e) {}

function api(action, args){
  var initData = tg && tg.initData;
  if (!initData) return Promise.resolve({ ok: false, error: 'not_in_telegram' });
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData, slug: S.slug, action: action, args: args || {} }) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok: false, error: 'network' }; });
}
var ERR = {
  not_in_telegram: 'Please open the dashboard from the 📊 button in your Telegram group.',
  not_in_group: 'This dashboard is only for people in the salon\'s Telegram group.',
  too_old: 'This page was open too long. Close it and open it again from the group.',
  bad_signature: 'Telegram could not confirm who you are. Close it and open it again from the group.',
  network: 'No connection right now. Check your internet and try again.',
  no_bot_token_in_vault: 'The dashboard is not switched on yet.',
  unknown_client: 'This salon was not found.'
};
function fail(r){
  var msg = (r && (r.hint || ERR[r.error])) || 'Something went wrong. Please try again in a minute.';
  $('main').innerHTML = '<div class="center"><div class="h2">' + esc(msg) + '</div>' +
    '<button class="close" style="padding:0 20px" onclick="location.reload()">Try again</button></div>';
}

function drawHeader(){
  $('hdr').style.display = '';
  $('hname').textContent = (S.client && S.client.name) || 'Dashboard';
  $('hdate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  var tabs = TABS.filter(function(t){ return (S.hide || []).indexOf(t[0]) < 0; });
  var tb = $('tostudio'); if (tb) tb.style.display = (S.me && S.me.studio) ? '' : 'none';
  $('tabs').innerHTML = tabs.map(function(t){ return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('');
  if (S.me && S.me.studio && S.clients) {
    $('pick').style.display = '';
    $('pick').innerHTML = S.clients.map(function(c){ return '<option value="' + esc(c.slug) + '"' + (S.client && c.slug === S.client.slug ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
  }
}
$('tabs').addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.getAttribute('data-tab'); S.args = {}; load(); });
$('pick').addEventListener('change', function(){ S.slug = this.value; S.args = {}; load(); });

function helpBox(h){
  if (!h) return '';
  if (!S.showHelp) return '<button class="helpbtn" data-act="help">What is this page?</button>';
  return '<div class="help"><b>What is this page?</b>' + esc(h.what) + '<br><br><b>What to do</b>' + esc(h.how) +
    '<br><button class="helpbtn" data-act="help">Hide this box</button></div>';
}

// ---------- FAST (17 Nov): what was already loaded shows at once; the fresh copy comes in quietly behind ----------
// CACHE keeps every answer of the server for 10 minutes (per business, per screen, per filter). A copy younger than
// 20 seconds is used as it is (no new request); an older one is shown at once and refreshed behind. Anything that
// CHANGES something (sending, booking, ignoring…) empties it, so the next screen is always the real one.
var CACHE = {}, FRESH_MS = 20000, KEEP_MS = 600000;
S.seq = 0; S.shown = ''; S.pref = {};
function ckey(slug, action, args){ return (slug || '-') + '|' + action + '|' + JSON.stringify(args || {}); }
function cget(slug, action, args){ var c = CACHE[ckey(slug, action, args)]; return (c && Date.now() - c.at < KEEP_MS) ? c : null; }
function cput(slug, action, args, r){ if (slug && r && r.ok && r.data && !r.data.error) CACHE[ckey(slug, action, args)] = { r: r, at: Date.now(), sig: JSON.stringify(r.data) }; }
function cclear(){ CACHE = {}; }
function busy(on, dim){ var e = $('upd'); if (e) e.style.display = on ? '' : 'none'; $('main').classList.toggle('stale', !!(on && dim)); }
function prefetch(action, args){   // one screen ahead, once per business: the one most likely to be tapped next
  var slug0 = S.slug; if (!slug0 || S.pref[slug0 + '|' + action] || cget(slug0, action, args)) return;
  S.pref[slug0 + '|' + action] = 1;
  api(action, args).then(function(r){ cput(slug0, action, args, r); });
}
function draw(r, tab, keepScroll){
  S.me = r.me; S.client = r.client; if (r.clients) S.clients = r.clients; S.slug = r.client.slug; S.hide = r.hide || [];
  drawHeader();
  if (typeof morningCheck === 'function') setTimeout(morningCheck, 1200);   // step 5: the day's first line
  var d = r.data || {};
  if (d.error) return fail({ error: d.error });
  var y = window.scrollY || 0;
  var html = (R[tab] || function(){ return ''; })(d);
  $('main').innerHTML = helpBox(d.help) + html;
  S.shown = tab + '|' + S.slug;
  if (S.cqFocus && tab === 'customers') { S.cqFocus = false; var cq = $('cq'); if (cq) { var vv = cq.value; cq.focus(); try { cq.setSelectionRange(vv.length, vv.length); } catch (e) {} } }
  if (tab === 'bookings' && (S.args.range || 'week') === 'day') loadDay(S.args.day || todayStr());
  window.scrollTo(0, keepScroll ? y : 0);
}
function load(opt){
  opt = opt || {};
  var tabNow = S.tab, slug0 = S.slug, seq = ++S.seq;
  var args = S.args;
  if (S.tab === 'messages' && !args.kind) { args = Object.assign({ kind: 'dm' }, args); }
  args = JSON.parse(JSON.stringify(args));                 // as it is now: later taps do not change this request
  if (tabNow === 'messages') {                             // "Needs you / All apps / Month" are what the server gives when nothing is said: one copy, not two
    if (args.filter === 'needs') delete args.filter; if (args.platform === 'all') delete args.platform; if (args.when === 'all') delete args.when;
  }
  var hit = cget(slug0, tabNow, args);
  if (hit) {
    draw(hit.r, tabNow, opt.keepScroll);                    // at once
    if (Date.now() - hit.at < FRESH_MS) return busy(false);
    busy(true, false);
  } else if (S.shown === tabNow + '|' + slug0 && $('main').children.length) {
    busy(true, true);                                       // same screen, another filter: the old list stays (dimmed) until the new one is here
  } else {
    $('main').innerHTML = '<div class="empty">Loading…</div>'; busy(false);
  }
  api(tabNow, args).then(function(r){
    if (seq !== S.seq) return;                              // a newer tap took over
    busy(false);
    if (!r || !r.ok) { if (hit) return; return fail(r); }   // no connection: what was on screen stays
    var slug = slug0 || (r.client && r.client.slug);
    var same = hit && hit.sig === JSON.stringify(r.data || {});
    cput(slug, tabNow, args, r);
    if (same) { S.slug = r.client.slug; return; }           // nothing new: the screen is not touched
    draw(r, tabNow, !!hit || opt.keepScroll);
    if (tabNow === 'today') prefetch('messages', { kind: 'dm' }); else if (tabNow === 'messages') prefetch('today', {});
  });
}

function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
function todayStr(){ return ymd(new Date()); }
function weekDay(i){ var t = new Date(); t.setHours(12, 0, 0, 0); t.setDate(t.getDate() - t.getDay() + i); return ymd(t); }
function loadDay(day){
  var box = document.getElementById('daylist'); if (!box) return;
  var slugD = S.slug, hitD = cget(slugD, 'today', { day: day }), netD = !(hitD && Date.now() - hitD.at < FRESH_MS);
  (netD ? api('today', { day: day }) : Promise.resolve(hitD.r)).then(function(r){
    if (netD) cput(slugD, 'today', { day: day }, r);
    var el = document.getElementById('daylist'); if (!el) return;
    var d = r && r.ok && r.data; if (!d || d.error) { el.innerHTML = '<div class="empty">Could not load this day.</div>'; return; }
    var rows = (d.schedule || []).filter(function(x){ return x.kind === 'booking'; });
    el.innerHTML = '<div class="h2">' + esc(d.date_label) + ' · ' + rows.length + (rows.length === 1 ? ' appointment' : ' appointments') + '</div>' +
      (rows.length ? rows.map(function(x){ return '<button class="row" data-cust-b="' + esc(x.booking_id) + '"><div class="t">' + esc(x.time) + '<small>' + esc(x.ampm || '') + '</small></div><div class="grow"><div class="who">' + esc(x.who) + '</div><div>' + pill(x.status, x.tone) + '</div><div class="what">' + esc([x.what, x.from].filter(Boolean).join(' · ')) + '</div></div></button>'; }).join('')
                   : '<div class="empty">No appointments this day.</div>');
  });
}

// ---------- Today · one line per "needs you" ----------
var NEED_ENDS = / (is waiting for your OK|wants a time that is taken|is ready to book|wrote on .+|commented on .+)$/;
function shortDayTime(t){   // "Tuesday Nov 24 at 11:00 AM" → "Tue Nov 24, 11:00 AM"
  return String(t || '').replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*day\b/, '$1').replace(/ at /, ', ');
}
function shortStyle(x){   // "Two Strand Twist (Own hair only) (Bouncy Wet Twists) — Small 8\" (Ear length)" → "Two Strand Twist · Small 8\""
  var bits = String(x || '').split(/\s+[—–-]\s+/).map(function(b){ return b.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim(); }).filter(Boolean);
  var out = bits.slice(0, 2).join(' · ') || String(x || '');
  return out.length > 48 ? out.slice(0, 46).replace(/\s+\S*$/, '') + '…' : out;
}
var SQUARE_APPTS = 'https://app.squareup.com/dashboard/appointments';
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-square]'); if (!b) return;
  if (tg && tg.openLink) tg.openLink(SQUARE_APPTS); else window.open(SQUARE_APPTS, '_blank', 'noopener');
});
function isDayTime(x){ return /\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*day\b|\bToday\b|\bTomorrow\b|\b\d{1,2}:\d{2}\s?(AM|PM)\b/i.test(x); }
function needLine(n){
  var name = String(n.title || '').replace(NEED_ENDS, '').replace(/ · booking NOT in Square$/, '') || 'A customer';
  var parts = [];
  if (n.kind === 'site_request' || n.kind === 'taken_time' || n.kind === 'booking_failed') {
    var bits = String(n.detail || '').split(' · ').filter(Boolean);
    var when = bits.filter(isDayTime), style = bits.filter(function(x){ return !isDayTime(x); });
    parts = when.map(shortDayTime).concat(style.map(shortStyle));
  } else if (n.kind === 'hot_lead') {
    parts = [n.detail || ''];
  } else {   // a message or a comment: name · app · how long ago
    var app = ({ sms: 'Text', instagram: 'Instagram', facebook: 'Facebook', tiktok: 'TikTok' })[n.platform] || '';
    var ago = (String(n.note || '').match(/(\d+\s+\w+\s+ago|just now|yesterday)\.?$/i) || [])[1] || '';
    parts = [app, ago];
  }
  var line = '<b>' + esc(name) + '</b>' + parts.filter(Boolean).map(function(x){ return ' · ' + esc(x); }).join('');
  if (n.booking_id) return '<div class="nrow"><div class="grow">' + line + '</div><button class="mini" data-cust-b="' + esc(n.booking_id) + '">Customer<br>card</button></div>';
  if (n.conversation_id) return '<div class="nrow"><div class="grow">' + line + '</div><button class="mini" data-thread="' + esc(n.conversation_id) + '">Answer</button></div>';
  if (n.kind === 'comment' && n.item_id) return '<div class="nrow"><div class="grow">' + line + '</div><button class="mini" data-comment="' + esc(n.item_id) + '">Answer</button></div>';
  if (n.lead_id) return '<div class="nrow"><div class="grow">' + line + '</div><button class="mini" data-cust-l="' + esc(n.lead_id) + '">Customer<br>card</button></div>';
  return '<div class="nrow"><div class="grow">' + line + '</div></div>';
}
// ---------- screens ----------
var R = {};
R.today = function(d){
  var h = '';
  var needs = d.needs_you || [];
  if (needs.length) {
    // Amina 4 Nov: one small line each — name · day and time · style — and the button. The "what to do" is said once per group.
    var GROUPS = [
      ['booking_failed', '⚠️ NOT booked in Square · book them yourself or call them'],
      ['site_request', 'Website requests · accept them in Square'],
      ['taken_time', 'Time is taken · answer YES or NO in your group'],
      ['dm', 'Messages to answer'],
      ['comment', 'Comments to answer'],
      ['hot_lead', 'Ready to book · the AI is talking with them']];
    h += '<div class="card warn"><div class="nhead">NEEDS YOU · ' + needs.length + '</div>';
    GROUPS.forEach(function(g){
      var list = needs.filter(function(n){ return n.kind === g[0] || (g[0] === 'dm' && n.kind !== 'comment' && !GROUPS.some(function(x){ return x[0] === n.kind; })); });
      if (!list.length) return;
      h += '<div class="ngroup">' + esc(g[1]) + '</div>';
      if (g[0] === 'site_request') h += '<button class="sqbtn" data-square="1">✅ Open Square to accept them</button><div class="what">In Square: Overview → Notifications → tap the person → Accept.</div>';
      if (g[0] === 'booking_failed') h += '<div class="what">The AI tried to book these, but Square did not take them - the customer may think they are booked. Book them in Square, or call them (their number is on the customer card).</div><button class="sqbtn" data-square="1">📅 Open Square to book them</button>';
      list.forEach(function(n){ h += needLine(n); });
    });
    h += '</div>';
  }
  var c = d.counts || {};
  h += '<div class="card"><div class="h2">Today, hour by hour</div><div class="muted">' + esc(c.appointments || 0) + ' appointments' +
       (c.here ? ' · ' + esc(c.here) + ' here' : '') + ' · Tap a person to see their card.</div>';
  if (!(d.schedule || []).length) h += '<div class="empty">No appointments today.</div>';
  (d.schedule || []).forEach(function(s){
    var tag = s.kind === 'booking' ? 'button' : 'div';
    h += '<' + tag + ' class="row"' + (s.booking_id ? ' data-cust-b="' + esc(s.booking_id) + '"' : '') + '><div class="t">' + esc(s.time) + '<small>' + esc(s.ampm || '') + '</small></div>' +
      '<div class="grow"><div class="who">' + esc(s.who) + '</div>' + (s.status ? '<div>' + pill(s.status, s.tone) + '</div>' : '') + '<div class="what">' + esc([s.what, s.from].filter(Boolean).join(' · ')) + '</div></div></' + tag + '>';
  });
  return h + '</div>';
};
R.messages = function(d){
  var f = S.args.filter || 'needs', p = S.args.platform || 'all', k = S.args.kind || 'dm', w = S.args.when || 'all', c = d.counts || {}, ks = d.kinds || {};
  function chips(arg, cur, list){ return '<div class="chips">' + list.map(function(x){ return '<button class="chip' + (cur === x[0] ? ' on' : '') + '" data-arg="' + arg + '" data-val="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>'; }
  function seg(arg, cur, list){ return '<div class="seg">' + list.map(function(x){ return '<button class="' + (cur === x[0] ? 'on' : '') + '" data-arg="' + arg + '" data-val="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>'; }
  function badge(n){ return n ? ' <span class="badge">' + esc(n) + '</span>' : ''; }
  var h = '<div class="filters">';
  h += seg('kind', k, [['dm','💬 Messages ' + esc(ks.dm || 0) + badge(ks.dm_needs)],['comment','🗨️ Comments ' + esc(ks.comment || 0) + badge(ks.comment_needs)]]);
  h += seg('platform', p, (k === 'comment' ? [['all','All'],['instagram','Insta'],['facebook','FB'],['tiktok','TikTok']]
                                           : [['all','All'],['sms','Text'],['instagram','Insta'],['facebook','FB'],['tiktok','TikTok']]));
  h += seg('when', w, [['today','Today'],['yesterday','Yesterday'],['week','Week'],['all','Month']]);
  h += seg('filter', f, [['needs','Needs you ' + esc(c.needs || 0)],['done','Answered ' + esc(c.done || 0)],['all','All ' + esc(c.all || 0)]]);
  h += '</div>';
  var items = d.items || [];
  if (!items.length) h += '<div class="card"><div class="empty">' + (f === 'needs' ? 'Nothing is waiting for you here. 🎉' : 'Nothing here.') + '</div></div>';
  items.forEach(function(m){
    var attr = m.kind === 'comment' ? 'data-comment="' + esc(m.item_id) + '"' : 'data-thread="' + esc(m.conversation_id) + '"';
    h += '<button class="card" style="text-align:left;cursor:pointer" ' + attr + '><div class="hrow"><div class="who">' + esc(m.who) + '</div>' + pill(m.tag, m.tone) + '</div>' +
      '<div class="muted">' + esc(m.where) + '</div><div>They wrote: ' + esc(m.said) + '</div>' +
      (m.reply_label ? '<div class="reply"><b>' + esc(m.reply_label) + '</b> ' + esc(m.reply || '') + '</div>' : '') + '</button>';
  });
  if (d.more && items.length) h += '<button class="close" data-more="' + esc(items[items.length - 1].at) + '">Show older messages</button>';
  return h;
};
R.bookings = function(d){
  var rg = S.args.range || 'week';
  var h = '<div class="chips">' + [['day','Day'],['week','Week'],['month','Month']].map(function(x){
    return '<button class="chip' + (rg === x[0] ? ' on' : '') + '" data-arg="range" data-val="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  var bars = d.bars || [], max = 1;
  bars.forEach(function(b){ if ((b.n || 0) > max) max = b.n; });
  var last = rg === 'day' ? -1 : bars.length - 1;

    var said = String(e.transcript || '').trim(); LV.last = Date.now(); if (!said) return;
    var mine = { who: 'owner', name: (S.me && S.me.name) || 'You', text: said, live: true, saved: true };
    // put it before the answer it led to, if that answer already started
    if (LV.cur && CH.lines.indexOf(LV.cur) >= 0) CH.lines.splice(CH.lines.indexOf(LV.cur), 0, mine); else CH.lines.push(mine);
    chatDraw(false); api('chat_add', { text: said, reply: '', via: 'live' }); return;
  }
  if (t === 'response.output_audio_transcript.delta') {
    if (!LV.cur) { LV.cur = { who: 'assistant', text: '', live: true }; CH.lines.push(LV.cur); }
    LV.cur.text += String(e.delta || ''); LV.last = Date.now(); liveDraw(); return;
  }
  if (t === 'response.output_audio_transcript.done') {
    var line = LV.cur || { who: 'assistant', text: '', live: true }; if (!LV.cur) CH.lines.push(line);
    if (e.transcript) line.text = String(e.transcript);
    LV.cur = null; LV.last = Date.now(); chatDraw(false); if (line.text.trim()) liveSaveReply(line); return;
  }
  if (t === 'response.function_call_arguments.done') {   // the answer is finished at response.done; this is only the fallback
    var cid = e.call_id; if (!cid || LV.calls[cid] || LV.wait[cid]) return;
    LV.wait[cid] = setTimeout(function(){ delete LV.wait[cid]; liveCall(cid, e.name, e.arguments); }, 1500); return;
  }
  if (t === 'response.done') {
    var out = (e.response && Array.isArray(e.response.output)) ? e.response.output : [];
    out.forEach(function(it){ if (it && it.type === 'function_call') { if (LV.wait[it.call_id]) { clearTimeout(LV.wait[it.call_id]); delete LV.wait[it.call_id]; } liveCall(it.call_id, it.name, it.arguments); } });
    LV.last = Date.now(); return;
  }
  if (t === 'output_audio_buffer.stopped') { if (LV.endAfter) liveStop(''); return; }
  if (t === 'error') { var m = (e.error && (e.error.message || e.error.code)) || 'something went wrong'; liveNote('⚠️ ' + String(m).slice(0, 160)); return; }
}
function liveCall(id, name, argStr){
  if (!id || LV.calls[id]) return; LV.calls[id] = true; LV.last = Date.now();
  var a = {}; try { a = typeof argStr === 'string' ? JSON.parse(argStr || '{}') : (argStr || {}); } catch (x) { a = {}; }
  if (name === 'end_call') {
    LV.endAfter = true; liveSend({ type: 'conversation.item.create', item: { type: 'function_call_output', call_id: id, output: JSON.stringify({ ok: true }) } });
    clearTimeout(LV.endT); LV.endT = setTimeout(function(){ liveStop(''); }, 4000); return;
  }
  var body = null;
  if (name === 'look_up' || name === 'ask_desk') {
    var req = String(a.request || '').slice(0, 900); if (!req) return liveReply(id, { error: 'say what the person wants' });
    LV.pending++;
    return think(req, true).then(function(res){
      LV.pending--;
      CH.lines.forEach(function(l){ l.buttons = null; });
      LV.buttons = (res.buttons || []).slice();
      (res.lines || []).forEach(function(l){ if (l.buttons && l.buttons.length) { var cl = { who: 'assistant', text: l.text, html: !!l.html, buttons: l.buttons, live: true, saved: !(/^(📩|🧠)/.test(l.text) || l.card) }; CH.lines.push(cl); if (!cl.saved) liveSaveReply(cl); } });
      if (res.links) { var ll = { who: 'assistant', text: res.links, live: true, when: '' }; CH.lines.push(ll); liveSaveReply(ll); }   // 3b: what to open goes in the chat, saved for everyone
      chatDraw(true);
      if (res.done) { cclear(); load({ keepScroll: true }); }
      var rep = { answer: String(res.say || '').replace(URL_RE, 'the link').slice(0, 3000), buttons_on_screen: LV.buttons.map(function(x){ return x.text; }), done: !!res.done };
      if (res.extra && res.extra.message_on_card) { rep.message_on_card = res.extra.message_on_card; rep.how_to_send = 'read these words to them and ask if you should send it; press_button "Send" only after a clear yes'; }
      if (res.extra && res.extra.card_on_screen) { rep.card_on_screen = res.extra.card_on_screen; rep.how_to_confirm = 'say in a few words what it will do (who, what, when, price) and ask; press_button with the button label (for example "Book it") only after a clear yes; say it is done only when press_button answers that Square did it'; }
      if (res.extra && res.extra.fact_on_card) { rep.fact_on_card = res.extra.fact_on_card; rep.how_to_save = 'read the fact to them and ask if you should save it; press_button "Save" only after a clear yes ("Skip" when they say no to a proposal)'; }
      liveReply(id, res.ok ? Object.assign(rep, {
                                links_in_chat: res.links ? res.links.split('\n').map(function(x){ return x.replace(/^🔗\s*/, '').replace(/:\s*https?:\/\/\S+$/, ''); }) : [] })
                           : { error: String(res.say || 'no answer').slice(0, 300) });
    });
  }
  else if (name === 'press_button') {
    var want = String(a.label || '').trim().toLowerCase(), b = null;
    LV.buttons.forEach(function(x){ if (!b && String(x.text).trim().toLowerCase() === want) b = x; });
    LV.buttons.forEach(function(x){ if (!b && want && String(x.text).toLowerCase().indexOf(want) >= 0) b = x; });
    if (!b) return liveReply(id, { error: 'that button is not on the screen now', buttons: LV.buttons.map(function(x){ return x.text; }) });
    if (/^(sndx|chg):/.test(b.cb)) { sendChange(); return liveReply(id, { answer: 'ask them what to change, then use look_up with the change' }); }
    if (/^memn?:/.test(b.cb)) {
      LV.pending++;
      return memCall(b.cb.replace(/^memn?:/, ''), /^mem:/.test(b.cb)).then(function(r){
        LV.pending--;
        CH.lines.forEach(function(l){ l.buttons = null; });
        LV.buttons = (r.buttons || []).slice();
        var ln = { who: 'assistant', text: r.text, buttons: r.buttons || null, live: true, when: '' }; CH.lines.push(ln); liveSaveReply(ln); chatDraw(true);
        liveReply(id, r.done ? { answer: r.text, done: true } : { error: r.text, buttons_on_screen: LV.buttons.map(function(x){ return x.text; }) });
      });
    }
    if (/^snd:/.test(b.cb)) {
      LV.pending++;
      return sendCall(b.cb.slice(4)).then(function(r){
        LV.pending--;
        CH.lines.forEach(function(l){ l.buttons = null; });
        LV.buttons = (r.buttons || []).slice();
        var ln = { who: 'assistant', text: r.text, buttons: r.buttons || null, live: true, when: '' }; CH.lines.push(ln); liveSaveReply(ln); chatDraw(true);
        liveReply(id, r.sent ? { answer: r.text, sent: true } : { error: r.text, sent: false, buttons_on_screen: LV.buttons.map(function(x){ return x.text; }) });
      });
    }
    body = { cb: b.cb };
  } else return liveReply(id, { error: 'unknown tool ' + name });
  if (!body.cb && body.text.length < 1) return liveReply(id, { error: 'say what the person wants' });
  LV.pending++;
  actCall(Object.assign({ reply_text: CH.reply }, body)).then(function(r){
    if (r && r.error === 'need_check') return api('home').then(function(){ return actCall(Object.assign({ reply_text: CH.reply }, body)); });
    return r;
  }).then(function(r){
    LV.pending--;
    if (!r || r.ok === false) { CH.reply = ''; return liveReply(id, { error: (r && (r.hint || ACTERR[r.error] || ERR[r.error])) || 'the desk did not answer - nothing was booked or changed' }); }
    var text = plain(r.text || '', !!r.html), btns = r.buttons || [];
    CH.reply = /📝/.test(r.text || '') ? String(r.text) : '';
    CH.lines.forEach(function(l){ l.buttons = null; });
    LV.buttons = btns.slice();
    if (btns.length) CH.lines.push({ who: 'assistant', text: r.text || '', html: !!r.html, buttons: btns, live: true, saved: true });
    chatDraw(!!btns.length);
    if (r.done) { cclear(); load({ keepScroll: true }); }
    liveReply(id, { answer: text.slice(0, 3000), buttons_on_screen: btns.map(function(x){ return x.text; }), done: !!r.done });
  });
}
function liveReply(id, out){
  liveSend({ type: 'conversation.item.create', item: { type: 'function_call_output', call_id: id, output: JSON.stringify(out) } });
  if (!LV.pending && !LV.endAfter) liveSend({ type: 'response.create' });
}
function liveType(t){
  CH.lines.push({ who: 'owner', name: (S.me && S.me.name) || 'You', text: t, live: true, saved: true }); chatDraw(true);
  api('chat_add', { text: t, reply: '', via: 'live' }); LV.last = Date.now();
  liveSend({ type: 'conversation.item.create', item: { type: 'message', role: 'user', content: [{ type: 'input_text', text: t }] } });
  liveSend({ type: 'response.create' });
}
$('chcall').addEventListener('click', function(){ if (LV.on) liveStop(''); else liveStart(); });

// first open: the link's start_param decides the salon (the door checks it)
try { S.slug = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || null; } catch (e) {}
if (S.slug === 'studio') { S.slug = null; studioOpen(); } else load();
})();
</script>
