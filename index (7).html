<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--ink:#161514;--soft:#4E4943;--mute:#6E6860;--line:#E2DCD2;--blue:#0B5FA5;
--ok-b:#E3F1EC;--ok-f:#155C3A;--info-b:#E5EEF9;--info-f:#0A3D6B;--warn-b:#FCEFD9;--warn-f:#7A3E00;--bad-b:#FBE4E1;--bad-f:#8E2418;--gray-b:#EFEBE4;--gray-f:#3E3A35;
--c-ai:#2A78D6;--c-web:#EB6834;--c-salon:#1BAF7A;--bar:#8DB8EA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.4}
button{font-family:inherit;font-size:inherit;color:inherit}
header{background:var(--card);padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:22px;font-weight:800}
.sub{font-size:15px;color:var(--mute)}
select{font-size:16px;min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;padding:0 10px;max-width:55%}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;min-height:48px;padding:0 16px;border-radius:999px;font-size:17px;font-weight:700;border:2px solid #CFC9BF;background:#fff;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
.help{background:#FFF8E8;border:1px solid #F0DDB2;border-radius:14px;padding:12px 14px}
.help b{display:block;margin-bottom:4px}
.helpbtn{background:none;border:0;color:var(--blue);font-weight:700;padding:0;min-height:40px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.warn{border:2px solid #F0B868;background:#FFFBF3}
.nhead{font-weight:800;color:var(--warn-f);font-size:16px}
.ngroup{font-size:14px;color:var(--warn-f);font-weight:700;margin-top:4px}
.nrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #F3DDB8;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;cursor:default}
.nrow .grow{font-size:16px;line-height:1.35}
.sqbtn{min-height:50px;border-radius:12px;border:0;background:#1BAF7A;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin:4px 0}
.nrow .mini{flex:0 0 auto;min-height:48px;padding:2px 10px;line-height:1.15;border-radius:12px;border:2px solid #CFC9BF;background:#fff;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.h2{font-size:19px;font-weight:800}
.big{font-size:26px;font-weight:800}
.muted{color:var(--mute);font-size:15px}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.row:first-of-type{border-top:0}
.row .t{min-width:62px;font-weight:800;font-size:18px}
.row .t small{display:block;font-size:13px;color:var(--mute);font-weight:600}
.grow{flex:1;min-width:0}
.who{font-weight:700;font-size:18px}
.what{color:var(--soft);font-size:15px;word-wrap:break-word}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--ok-b);color:var(--ok-f)}.info{background:var(--info-b);color:var(--info-f)}.warn{background:var(--warn-b);color:var(--warn-f)}.bad{background:var(--bad-b);color:var(--bad-f)}.gray{background:var(--gray-b);color:var(--gray-f)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:48px;padding:0 14px;border-radius:999px;font-size:16px;font-weight:700;border:2px solid #CFC9BF;background:#fff;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.reply{background:#F3F6FA;border-radius:10px;padding:8px 10px;font-size:15px}
.bars{display:flex;align-items:flex-end;gap:6px;height:190px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.bar span.n{font-size:14px;font-weight:700}
.bar span.b{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--bar)}
.bar.last span.b{background:var(--c-ai)}
.labels{display:flex;gap:6px}.labels span{flex:1;text-align:center;font-size:13px;color:var(--soft);min-width:0;overflow:hidden}
.split{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--gray-b)}
.leg{display:flex;flex-direction:column;gap:6px;font-size:16px}
.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-2px}
.fun{display:flex;flex-direction:column;gap:4px}
.fun .l{display:flex;justify-content:space-between;font-size:17px}
.fun .track{height:10px;border-radius:999px;background:#E5EEF9;overflow:hidden}
.fun .track span{display:block;height:100%;background:var(--c-ai)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:14px;color:var(--mute)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.close{min-height:48px;border-radius:12px;border:2px solid #CFC9BF;background:#fff;font-weight:700;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none;padding:0 14px}
.bub{max-width:85%;padding:10px 12px;border-radius:14px;font-size:16px}
.bub.them{background:#fff;border:1px solid var(--line);align-self:flex-start}
.bub.ai{background:#E5EEF9;align-self:flex-end}
.bub.you{background:#E3F1EC;align-self:flex-end}
.bub small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.empty{color:var(--mute);text-align:center;padding:18px 8px}
.center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
input.search{width:100%;min-height:48px;font-size:17px;border-radius:12px;border:2px solid var(--line);padding:0 12px}
a{color:var(--blue)}
.filters{display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 auto;min-width:0;min-height:46px;padding:0 4px;border-radius:12px;font-size:15px;font-weight:700;border:2px solid #CFC9BF;background:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#D9480F;color:#fff;font-size:13px;line-height:20px}
.askbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.askbar input,.ansbox input{flex:1;min-width:0;min-height:50px;font-size:17px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}
.askbar button,.ansbox button{min-height:50px;padding:0 18px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.you{align-self:flex-end;background:#E3F1EC;border-radius:14px;padding:10px 12px;font-size:16px;max-width:90%}
.ans{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;line-height:1.45;word-wrap:break-word}
.acts{display:flex;flex-direction:column;gap:8px}
.acts button{min-height:52px;border-radius:14px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:17px;cursor:pointer}
.acts button:first-child{background:var(--blue);color:#fff}
.ansbox{display:flex;gap:8px}
.donebar{background:var(--ok-b);color:var(--ok-f);border-radius:12px;padding:10px 12px;font-weight:700}
.mimg{display:block;max-width:100%;max-height:340px;border-radius:12px;margin:2px 0 4px;cursor:pointer;background:#EFEBE4}
.mvid{display:block;width:100%;max-height:360px;border-radius:12px;margin:2px 0 4px;background:#000}
.mlink{display:block;width:100%;min-height:46px;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:800;font-size:16px;margin:2px 0 4px;cursor:pointer}
.mgone{font-size:15px;color:var(--mute);background:#F3F0EA;border-radius:10px;padding:8px 10px;margin:2px 0 4px}
.thbox .cam{min-width:56px;border-radius:14px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px;cursor:pointer}
.thbox.rec .cam{display:none}
.thphoto{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px}
.thphoto img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.thphoto .grow{font-size:15px}
.thphoto button{min-width:48px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.thans{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--line);padding-top:12px;margin-top:4px}
.thans .h2{margin:0}
.draft{background:#E5EEF9;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.4}
.draft .muted{font-size:14px;margin-bottom:4px}
.two{display:flex;gap:8px}.two button{flex:1}
.go{min-height:52px;border-radius:14px;border:0;background:var(--blue);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.go.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.go:disabled,.seg button:disabled{opacity:.45;cursor:default}
.thbox{display:flex;gap:8px;align-items:stretch}
.thbox textarea{flex:1;min-width:0;min-height:96px;font:inherit;font-size:17px;line-height:1.35;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fff}
.thbox.rec{background:#FDECEA;border-radius:14px;padding:6px}
.thbox.rec textarea{display:none}
.thbox .mic{min-width:56px;border-radius:14px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px;cursor:pointer}
.thbox.rec .mic{background:#C62828;border-color:#C62828;color:#fff;font-size:20px}
.thbox .x{display:none;min-width:50px;border-radius:14px;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:18px;cursor:pointer}
.thbox.rec .x{display:block}
.thbox.rec .recinfo{display:block}
.thnote{font-size:15px;color:var(--mute)}
.thnote.warn{color:#8E2418;font-weight:700}
.ign{min-height:46px;border-radius:12px;border:2px solid #CFC9BF;background:#fff;font-weight:700;font-size:16px;cursor:pointer;color:var(--ink)}
.askbar .mic,.ansbox .mic{min-width:56px;padding:0;background:#fff;color:var(--ink);border:2px solid var(--line);font-size:24px}
.askbar.rec,.ansbox.rec{background:#FDECEA}
.ansbox.rec{border-radius:14px;padding:6px}
.askbar.rec .mic,.ansbox.rec .mic{background:#C62828;border-color:#C62828;color:#fff;font-size:20px}
.recinfo{flex:1;min-width:0;font-size:17px;font-weight:700;color:#8E2418;display:none;align-self:center}
.askbar.rec .recinfo,.ansbox.rec .recinfo{display:block}
.askbar.rec #askq,.ansbox.rec #sheetq{display:none}
.askbar .x,.ansbox .x{display:none;background:#fff;color:var(--ink);border:2px solid var(--line)}
.askbar.rec .x,.ansbox.rec .x{display:block}
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <div class="hrow">
    <div><div class="title" id="hname">Dashboard</div><div class="sub" id="hdate"></div></div>
    <select id="pick" style="display:none" aria-label="Choose a client"></select>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"><div class="center"><div class="h2">Opening your dashboard…</div></div></main>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>
<form class="askbar" id="askbar" autocomplete="off"><button type="button" class="mic" id="mic" aria-label="Speak">🎤</button><input id="askq" enterkeyhint="send" placeholder="Ask or book…" aria-label="Ask or book"><div class="recinfo" id="recinfo">● Listening… 0 s</div><button type="button" class="x" id="recx" aria-label="Cancel">✕</button><button type="submit" id="asksend">Send</button></form>
<script>
(function(){
var tg = window.Telegram && window.Telegram.WebApp;
var N8N = 'https://diallomamadou1.app.n8n.cloud';   // the page can live anywhere; data always comes from n8n
var API = N8N + '/webhook/dash-api';
var S = { slug: null, tab: 'today', me: null, clients: null, client: null, args: {}, showHelp: true, svcFilter: '' };
var TABS = [['today','Today'],['messages','Messages'],['bookings','Bookings'],['regulars','Regulars'],['videos','Videos'],
            ['followups','Follow up'],['waitlist','Waitlist'],['knowledge','What the AI knows'],['rivals','Other salons'],['settings','Settings']];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pill(t, tone){ return t ? '<span class="pill ' + esc(tone || 'gray') + '">' + esc(t) + '</span>' : ''; }
function $(id){ return document.getElementById(id); }
try { if (tg) { tg.ready(); tg.expand(); if (tg.setHeaderColor) tg.setHeaderColor('#FFFFFF'); if (tg.setBackgroundColor) tg.setBackgroundColor('#F6F3EE'); } } catch (e) {}
try { var hs = localStorage.getItem('dash_help'); if (hs === '0') S.showHelp = false; } catch (e) {}

function api(action, args){
  var initData = tg && tg.initData;
  if (!initData) return Promise.resolve({ ok: false, error: 'not_in_telegram' });
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ init_data: initData, slug: S.slug, action: action, args: args || {} }) })
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok: false, error: 'network' }; });
}
var ERR = {
  not_in_telegram: 'Please open the dashboard from the 📊 button in your Telegram group.',
  not_in_group: 'This dashboard is only for people in the salon\'s Telegram group.',
  too_old: 'This page was open too long. Close it and open it again from the group.',
  bad_signature: 'Telegram could not confirm who you are. Close it and open it again from the group.',
  network: 'No connection right now. Check your internet and try again.',
  no_bot_token_in_vault: 'The dashboard is not switched on yet.',
  unknown_client: 'This salon was not found.'
};
function fail(r){
  var msg = (r && (r.hint || ERR[r.error])) || 'Something went wrong. Please try again in a minute.';
  $('main').innerHTML = '<div class="center"><div class="h2">' + esc(msg) + '</div>' +
    '<button class="close" style="padding:0 20px" onclick="location.reload()">Try again</button></div>';
}

function drawHeader(){
  $('hdr').style.display = '';
  $('hname').textContent = (S.client && S.client.name) || 'Dashboard';
  $('hdate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  var tabs = TABS.slice();
  if (S.me && S.me.studio) tabs.push(['admin', 'Studio Admin']);
  $('tabs').innerHTML = tabs.map(function(t){ return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + esc(t[1]) + '</button>'; }).join('');
  if (S.me && S.me.studio && S.clients) {
    $('pick').style.display = '';
    $('pick').innerHTML = S.clients.map(function(c){ return '<option value="' + esc(c.slug) + '"' + (S.client && c.slug === S.client.slug ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('');
  }
}
$('tabs').addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.getAttribute('data-tab'); S.args = {}; load(); });
$('pick').addEventListener('change', function(){ S.slug = this.value; S.args = {}; load(); });

function helpBox(h){
  if (!h) return '';
  if (!S.showHelp) return '<button class="helpbtn" data-act="help">What is this page?</button>';
  return '<div class="help"><b>What is this page?</b>' + esc(h.what) + '<br><br><b>What to do</b>' + esc(h.how) +
    '<br><button class="helpbtn" data-act="help">Hide this box</button></div>';
}

function load(){
  $('main').innerHTML = '<div class="empty">Loading…</div>';
  var tabNow = S.tab;
  var args = S.args;
  if (S.tab === 'messages' && !args.kind) { args = Object.assign({ kind: 'dm' }, args); }
  api(S.tab, args).then(function(r){
    if (tabNow !== S.tab) return;
    if (!r || !r.ok) return fail(r);
    S.me = r.me; S.client = r.client; if (r.clients) S.clients = r.clients; S.slug = r.client.slug;
    drawHeader();
    var d = r.data || {};
    if (d.error) return fail({ error: d.error });
    var html = (R[S.tab] || function(){ return ''; })(d);
    $('main').innerHTML = helpBox(d.help) + html;
    if (S.tab === 'bookings' && (S.args.range || 'week') === 'day') loadDay(S.args.day || todayStr());
    window.scrollTo(0, 0);
  });
}

function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(dt){ return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
function todayStr(){ return ymd(new Date()); }
function weekDay(i){ var t = new Date(); t.setHours(12, 0, 0, 0); t.setDate(t.getDate() - t.getDay() + i); return ymd(t); }
function loadDay(day){
  var box = document.getElementById('daylist'); if (!box) return;
  api('today', { day: day }).then(function(r){
    var el = document.getElementById('daylist'); if (!el) return;
    var d = r && r.ok && r.data; if (!d || d.error) { el.innerHTML = '<div class="empty">Could not load this day.</div>'; return; }
    var rows = (d.schedule || []).filter(function(x){ return x.kind === 'booking'; });
    el.innerHTML = '<div class="h2">' + esc(d.date_label) + ' · ' + rows.length + (rows.length === 1 ? ' appointment' : ' appointments') + '</div>' +
      (rows.length ? rows.map(function(x){ return '<button class="row" data-cust-b="' + esc(x.booking_id) + '"><div class="t">' + esc(x.time) + '<small>' + esc(x.ampm || '') + '</small></div><div class="grow"><div class="who">' + esc(x.who) + '</div><div>' + pill(x.status, x.tone) + '</div><div class="what">' + esc([x.what, x.from].filter(Boolean).join(' · ')) + '</div></div></button>'; }).join('')
                   : '<div class="empty">No appointments this day.</div>');
  });
}

// ---------- Today · one line per "needs you" ----------
var NEED_ENDS = / (is waiting for your OK|wants a time that is taken|is ready to book|wrote on .+|commented on .+)$/;
function shortDayTime(t){   // "Tuesday Nov 24 at 11:00 AM" → "Tue Nov 24, 11:00 AM"
  return String(t || '').replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*day\b/, '$1').replace(/ at /, ', ');
}
function shortStyle(x){   // "Two Strand Twist (Own hair only) (Bouncy Wet Twists) — Small 8\" (Ear length)" → "Two Strand Twist · Small 8\""
  var bits = String(x || '').split(/\s+[—–-]\s+/).map(function(b){ return b.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim(); }).filter(Boolean);
  var out = bits.slice(0, 2).join(' · ') || String(x || '');
  return out.length > 48 ? out.slice(0, 46).replace(/\s+\S*$/, '') + '…' : out;
}
var SQUARE_APPTS = 'https://app.squareup.com/dashboard/appointments';
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-square]'); if (!b) return;
  if (tg && tg.openLink) tg.openLink(SQUARE_APPTS); else window.open(SQUARE_APPTS, '_blank', 'noopener');
});
function isDayTime(x){ return /\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*day\b|\bToday\b|\bTomorrow\b|\b\d{1,2}:\d{2}\s?(AM|PM)\b/i.test(x); }
function needLine(n){
  var name = String(n.title || '').replace(NEED_ENDS, '') || 'A customer';
  var parts = [];
  if (n.kind === 'site_request' || n.kind === 'taken_time') {
    var bits = String(n.detail || '').split(' · ').filter(Boolean);
    var when = bits.filter(isDayTime), style = bits.filter(function(x){ return !isDayTime(x); });
    parts = when.map(shortDayTime).concat(style.map(shortStyle));
  } else if (n.kind === 'hot_lead') {
    parts = [n.detail || ''];
  } else {   // a message or a comment: name · app · how long ago
    var app = ({ sms: 'Text', instagram: 'Instagram', facebook: 'Facebook', tiktok: 'TikTok' })[n.platform] || '';

  }).then(function(r){
    var d = r.getChannelData(0), n = d.length, view = new DataView(new ArrayBuffer(44 + n * 2));
    function str(o, t){ for (var i = 0; i < t.length; i++) view.setUint8(o + i, t.charCodeAt(i)); }
    str(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, 16000, true); view.setUint32(28, 32000, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); str(36, 'data'); view.setUint32(40, n * 2, true);
    for (var i = 0; i < n; i++) { var v = Math.max(-1, Math.min(1, d[i])); view.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true); }
    return { b64: b64(view.buffer), mime: 'audio/wav', seconds: Math.round(n / 16000) };
  });
}
function recDone(){
  if (REC.cancel) { REC.chunks = []; return; }
  var sec = Math.max(1, Math.round((Date.now() - REC.t0) / 1000));
  if (sec < 1 || !REC.chunks.length) return micHelp(REC.where === 'thread' ? 'I did not hear anything. Tap 🎤 and speak.' : 'I did not hear anything. Tap 🎤, speak, then tap Send.');
  var type = (REC.rec && REC.rec.mimeType) || 'audio/webm';
  var blob = new Blob(REC.chunks, { type: type }); REC.chunks = [];
  var forThread = REC.where === 'thread';
  if (!forThread) sheet('<div class="you">🎙 Voice note · ' + sec + ' s</div><div class="empty">Listening to it…</div>');
  toWav(blob).catch(function(){   // could not convert: send the recording as it is
    return blob.arrayBuffer().then(function(buf){ return { b64: b64(buf), mime: type.split(';')[0], seconds: sec }; });
  }).then(function(a){
    if (a.b64.length > 3500000) return forThread ? thHint('That was too long. Please keep it under one minute.', true) : micHelp('That was too long for me. Please keep it under one minute.');
    if (forThread) return thHear(a);
    doAct({ audio_b64: a.b64, audio_mime: a.mime, seconds: a.seconds || sec, reply_text: S.reply }, '🎙 Voice note · ' + sec + ' s');
  });
}
$('mic').addEventListener('click', function(){ if (REC.on) recStop(false); else recStart('bar'); });
$('recx').addEventListener('click', function(){ recStop(true); });
$('askbar').addEventListener('submit', function(e){ if (REC.on) { e.preventDefault(); e.stopImmediatePropagation(); recStop(false); } }, true);

// ---------- taps ----------
document.addEventListener('click', function(e){
  var b = e.target.closest('button,[data-thread],[data-comment]'); if (!b) return;
  if (b.getAttribute('data-act') === 'help') { S.showHelp = !S.showHelp; try { localStorage.setItem('dash_help', S.showHelp ? '1' : '0'); } catch (x) {} return load(); }
  if (b.hasAttribute('data-arg')) { S.args[b.getAttribute('data-arg')] = b.getAttribute('data-val');
    if (b.getAttribute('data-arg') === 'kind' && b.getAttribute('data-val') === 'comment' && S.args.platform === 'sms') S.args.platform = 'all'; delete S.args.before; if (b.getAttribute('data-arg') === 'range') delete S.args.day; return load(); }
  if (b.hasAttribute('data-day')) { S.args.day = b.getAttribute('data-day'); var bars = document.querySelectorAll('[data-day]'); for (var i = 0; i < bars.length; i++) bars[i].classList.toggle('last', bars[i] === b); return loadDay(S.args.day); }
  if (b.hasAttribute('data-more')) { S.args.before = b.getAttribute('data-more'); return load(); }
  if (b.hasAttribute('data-tab-go')) { S.tab = b.getAttribute('data-tab-go'); S.args = {}; return load(); }
  if (b.hasAttribute('data-client')) { S.slug = b.getAttribute('data-client'); S.tab = 'today'; S.args = {}; return load(); }
  if (b.hasAttribute('data-cust-b')) return openCustomer({ booking_id: b.getAttribute('data-cust-b') });
  if (b.hasAttribute('data-cust-l')) return openCustomer({ lead_id: b.getAttribute('data-cust-l') });
  if (b.hasAttribute('data-cust-k')) { var k = b.getAttribute('data-cust-k'); return openCustomer(k.indexOf('ph:') === 0 ? { phone: k.slice(3) } : { square_customer_id: k }); }
  if (b.hasAttribute('data-thread')) return openThread({ conversation_id: b.getAttribute('data-thread') });
  if (b.hasAttribute('data-comment')) return openThread({ comment_id: b.getAttribute('data-comment') });
});
document.addEventListener('change', function(e){ if (e.target.id === 'plat') { S.args.platform = e.target.value; delete S.args.before; load(); } });
document.addEventListener('input', function(e){ if (e.target.id === 'svcq') { S.svcFilter = e.target.value; var l = $('svcl'); if (l) l.innerHTML = svcRows(S._svc || []); } });

// first open: the link's start_param decides the salon (the door checks it)
try { S.slug = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || null; } catch (e) {}
load();
})();
</script>
